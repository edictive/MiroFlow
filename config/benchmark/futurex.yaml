# config/benchmark/futurex.yaml
defaults:
  - default
  - _self_

name: "futurex"

data:
  data_dir: "${data_dir}/futurex"  # Path to your dataset
  metadata_file: "standardized_data.jsonl"  # Metadata filename
  whitelist: []  # Optional: List of specific task_ids to run
  level_filter: null  # Filter by level (1-4), null means no filter

execution:
  max_tasks: null      # null = no limit, or specify a number
  max_concurrent: ${oc.env:BENCHMARK_MAX_CONCURRENT,50}    # Number of parallel tasks
  pass_at_k: 1         # Number of attempts per task

# Reuse OpenRouter via the same API key and specify model/base URL for judging
openai_api_key: "${oc.env:OPENROUTER_API_KEY,skip_evaluation}"
openai_base_url: "${oc.env:OPENROUTER_BASE_URL,https://openrouter.ai/api/v1}"
openai_model_name: "${oc.env:OPENROUTER_EVAL_MODEL,qwen/qwen3-next-80b-a3b-thinking}"
openai_http_referer: "${oc.env:OPENROUTER_HTTP_REFERER,}"
openai_title: "${oc.env:OPENROUTER_TITLE,}"
